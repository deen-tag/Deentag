<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050B12">
<title>Deentag — Système céleste 3D</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500;600&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050B12;
  --gold:#DDB05C;
  --gold-light:#F2CE85;
  --ink:#EDF2EE;
  --muted:#8CA6A0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--void);color:var(--ink);font-family:'Spectral',serif;overflow:hidden;}
canvas{display:block;touch-action:none;}
.chrome{position:fixed;inset:0;pointer-events:none;z-index:40;}
.brandmark{position:absolute;top:22px;left:24px;font-family:'Cinzel',serif;letter-spacing:.28em;font-size:11px;color:var(--muted);pointer-events:auto;text-decoration:none;opacity:.85;}
.brandmark b{color:var(--gold-light);font-weight:600;}
.exit-link{position:absolute;top:22px;right:24px;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-decoration:none;pointer-events:auto;border:1px solid rgba(221,176,92,.28);padding:8px 14px;border-radius:999px;transition:.25s;}
.exit-link:hover{color:var(--gold-light);border-color:var(--gold-light);}
.mode-link{position:absolute;bottom:22px;right:24px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.16em;color:var(--muted);text-decoration:none;pointer-events:auto;opacity:.8;}
.mode-link:hover{color:var(--gold-light);}
.hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:'Spectral',serif;font-style:italic;font-size:12.5px;color:var(--muted);pointer-events:none;opacity:0;transition:opacity .6s ease .3s;}
.hint.show{opacity:.75;}
.back-btn{position:absolute;top:22px;left:24px;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.16em;color:var(--muted);background:rgba(5,11,18,.4);border:1px solid rgba(221,176,92,.28);padding:8px 16px;border-radius:999px;cursor:pointer;pointer-events:none;opacity:0;transition:opacity .4s ease, color .25s, border-color .25s;z-index:41;}
.back-btn.show{pointer-events:auto;opacity:1;}
.back-btn:hover{color:var(--gold-light);border-color:var(--gold-light);}
.loading{position:fixed;inset:0;z-index:80;background:var(--void);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;letter-spacing:.2em;font-size:11px;color:var(--muted);}
.loading.hide{display:none;}

/* écran d'ouverture */
#opening{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 50%, rgba(10,22,38,.55), var(--void) 70%);transition:opacity 1s ease;}
#opening.hide{opacity:0;pointer-events:none;}
.open-mark{width:96px;height:96px;border-radius:50%;border:1px solid rgba(221,176,92,.5);display:flex;align-items:center;justify-content:center;position:relative;animation:breathe 3.6s ease-in-out infinite;}
.open-mark::before{content:"";position:absolute;inset:-16px;border-radius:50%;border:1px solid rgba(221,176,92,.18);}
.open-mark span{font-family:'Cinzel Decorative',serif;font-size:20px;color:var(--gold-light);}
@keyframes breathe{0%,100%{box-shadow:0 0 0 rgba(221,176,92,0);}50%{box-shadow:0 0 34px rgba(221,176,92,.35);}}
.open-title{font-family:'Cinzel Decorative',serif;letter-spacing:.16em;font-size:15px;color:var(--muted);margin-top:26px;text-align:center;line-height:1.9;}
.open-cta{margin-top:36px;font-family:'Cinzel',serif;letter-spacing:.22em;font-size:11px;color:var(--gold-light);background:transparent;border:1px solid rgba(221,176,92,.5);padding:14px 30px;border-radius:999px;cursor:pointer;transition:.3s;}
.open-cta:hover{background:rgba(221,176,92,.12);box-shadow:0 0 24px rgba(221,176,92,.25);}

/* panneau monde (HUD 2D par-dessus la scène 3D) */
#hud{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(92vw,520px);text-align:center;z-index:41;opacity:0;pointer-events:none;transition:opacity .6s ease;}
#hud.show{opacity:1;pointer-events:auto;}
#hud .eyebrow{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.3em;color:var(--muted);}
#hud h2{font-family:'Cinzel Decorative',serif;font-size:clamp(20px,3.4vw,28px);letter-spacing:.05em;margin:8px 0 4px;color:var(--gold-light);}
#hud .tag{font-family:'Spectral',serif;font-style:italic;font-size:13px;color:var(--muted);margin-bottom:16px;}
#moons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
#moons button{all:unset;cursor:pointer;font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.1em;color:var(--ink);background:rgba(237,242,238,.06);border:1px solid rgba(237,242,238,.16);padding:9px 14px;border-radius:999px;transition:.25s;}
#moons button:hover,#moons button:focus-visible{background:rgba(221,176,92,.14);border-color:rgba(221,176,92,.5);color:var(--gold-light);}
.wv-cta{display:inline-block;font-family:'Cinzel',serif;letter-spacing:.16em;font-size:11px;color:var(--void);background:var(--gold-light);padding:13px 28px;border-radius:999px;text-decoration:none;transition:.25s;}
.wv-cta:hover{filter:brightness(1.08);box-shadow:0 0 26px rgba(221,176,92,.4);}

@media (max-width:560px){
  .brandmark,.exit-link,.back-btn{font-size:9.5px;padding:7px 11px;}
}
@media (prefers-reduced-motion: reduce){
  .open-mark{animation:none;}
}
</style>
</head>
<body>

<div class="loading" id="loading">Chargement de l'univers…</div>

<div id="opening">
  <div class="open-mark"><span>D</span></div>
  <div class="open-title">DEENTAG<br><span style="font-family:'Spectral',serif;font-style:italic;letter-spacing:0;font-size:12.5px;">un univers, quatre mondes — en 3D</span></div>
  <button class="open-cta" id="enterBtn">Entrer dans l'univers</button>
</div>

<canvas id="scene"></canvas>

<button class="back-btn" id="backBtn">← Retour au système</button>

<div id="hud">
  <div class="eyebrow" id="hudEyebrow">MONDE</div>
  <h2 id="hudTitle"></h2>
  <div class="tag" id="hudTag"></div>
  <div id="moons"></div>
  <a class="wv-cta" id="hudCta" href="#">Explorer ce monde →</a>
</div>

<div class="chrome">
  <a class="brandmark" href="index.html"><b>DEENTAG</b> · céleste 3D</a>
  <a class="exit-link" href="index.html">Retour au site</a>
  <a class="mode-link" href="espace-2d.html">← Version astrolabe 2D</a>
  <div class="hint" id="hint">Touchez une planète pour voyager vers son monde</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------- Données des mondes ---------------- */
const WORLDS = [
  { id:'invocations', name:'Invocations', tagline:'Une parole pour chaque instant du jour', href:'invocations.html',
    color:0xDDB05C, radius:34, speed:0.05, tilt:0.12,
    moons:['Quotidien','Adorations','Épreuves','Vie perso','Circonstances'] },
  { id:'coran', name:'Le Coran', tagline:'Le Livre, à portée de lecture', href:'quran.html',
    color:0x79D6A6, radius:50, speed:0.035, tilt:-0.16,
    moons:['Reprendre ma lecture','Coran complet','Par Jouz','Sourates célèbres','Par Prophète','Par Thème'] },
  { id:'enfants', name:'Deentag Kids', tagline:"L'islam raconté aux petits", href:'kids.html',
    color:0x8FC7E8, radius:66, speed:0.026, tilt:0.2,
    moons:['Réveil & Dodo','Ablutions','Repas','Maison','Transport','Toilettes'] },
  { id:'boutique', name:'Boutique', tagline:'Le rappel spirituel connecté', href:'shop.html',
    color:0xE3A468, radius:82, speed:0.02, tilt:-0.1,
    moons:["Découvrir l'objet",'Coloris','Le pack complet','Comment ça marche'] },
];

let scene, camera, renderer, sunMesh, raycaster, pointer;
let planets = []; // {mesh, glow, orbitLine, world, angle}
let clock;
let focused = null;
let camTarget = new THREE.Vector3();
let lookTarget = new THREE.Vector3();
let overview = true;

function makeGlowTexture(){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,0.9)');
  g.addColorStop(0.35,'rgba(255,255,255,0.35)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}

function init(){
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050B12, 0.0022);

  camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 4000);
  camera.position.set(0, 150, 300);
  camera.lookAt(0,0,0);

  renderer = new THREE.WebGLRenderer({canvas:document.getElementById('scene'), antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x050B12,1);

  scene.add(new THREE.AmbientLight(0x445566, 0.55));
  const sunLight = new THREE.PointLight(0xFFE3AC, 2.4, 900, 1.6);
  scene.add(sunLight);

  // étoiles
  const starGeo = new THREE.BufferGeometry();
  const starCount = 2600;
  const pos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r = 500 + Math.random()*1400;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    pos[i*3] = r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1] = r*Math.cos(phi);
    pos[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const starMat = new THREE.PointsMaterial({color:0xffffff, size:1.4, sizeAttenuation:true, transparent:true, opacity:0.85});
  scene.add(new THREE.Points(starGeo, starMat));

  const glowTex = makeGlowTexture();

  // soleil
  const sunGeo = new THREE.SphereGeometry(14, 40, 40);
  const sunMat = new THREE.MeshStandardMaterial({color:0xF2CE85, emissive:0xDDB05C, emissiveIntensity:1.3, roughness:0.4});
  sunMesh = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sunMesh);
  const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:0xF2CE85, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false}));
  sunGlow.scale.set(70,70,1);
  sunMesh.add(sunGlow);

  // planètes + orbites
  WORLDS.forEach((w,i)=>{
    const group = new THREE.Group();
    group.rotation.x = w.tilt;
    scene.add(group);

    // anneau d'orbite
    const ringPts = [];
    for(let a=0;a<=64;a++){
      const t = (a/64)*Math.PI*2;
      ringPts.push(new THREE.Vector3(Math.cos(t)*w.radius, 0, Math.sin(t)*w.radius));
    }
    const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
    const ringMat = new THREE.LineBasicMaterial({color:0xDDB05C, transparent:true, opacity:0.18});
    group.add(new THREE.Line(ringGeo, ringMat));

    const size = 4.2 + i*0.9;
    const geo = new THREE.SphereGeometry(size, 32, 32);
    const mat = new THREE.MeshStandardMaterial({color:w.color, roughness:0.55, metalness:0.15, emissive:w.color, emissiveIntensity:0.18});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.id = w.id;
    group.add(mesh);

    const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:w.color, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false}));
    glow.scale.set(size*5, size*5, 1);
    mesh.add(glow);

    planets.push({mesh, group, world:w, angle: Math.random()*Math.PI*2, frozen:false});
  });

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointerdown', onPointerDown);

  document.getElementById('loading').classList.add('hide');
  animate();
}

function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function onPointerDown(e){
  if(!overview) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(planets.map(p=>p.mesh));
  if(hits.length){
    const id = hits[0].object.userData.id;
    focusWorld(id);
  }
}

const hud = document.getElementById('hud');
const backBtn = document.getElementById('backBtn');
const hint = document.getElementById('hint');

function focusWorld(id){
  const p = planets.find(pl=>pl.world.id===id);
  if(!p) return;
  overview = false;
  focused = p;
  hint.classList.remove('show');
  backBtn.classList.add('show');

  document.getElementById('hudTitle').textContent = p.world.name;
  document.getElementById('hudTag').textContent = p.world.tagline;
  document.getElementById('hudCta').href = p.world.href;
  document.getElementById('hudCta').textContent = 'Explorer ' + p.world.name + ' →';
  const moonsBox = document.getElementById('moons');
  moonsBox.innerHTML='';
  p.world.moons.forEach(m=>{
    const b = document.createElement('button');
    b.textContent = m;
    b.addEventListener('click', ()=>{ window.location.href = p.world.href; });
    moonsBox.appendChild(b);
  });
}

backBtn.addEventListener('click', ()=>{
  overview = true;
  focused = null;
  hud.classList.remove('show');
  backBtn.classList.remove('show');
  setTimeout(()=>hint.classList.add('show'), 400);
});

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  sunMesh.rotation.y += dt*0.05;

  planets.forEach(p=>{
    if(!(p===focused)) p.angle += dt*p.world.speed;
    p.mesh.position.set(Math.cos(p.angle)*p.world.radius, 0, Math.sin(p.angle)*p.world.radius);
    p.mesh.rotation.y += dt*0.3;
  });

  // caméra
  if(overview){
    camTarget.set(0, 150, 300);
    lookTarget.set(0,0,0);
  } else if(focused){
    const wp = new THREE.Vector3();
    focused.mesh.getWorldPosition(wp);
    const dir = wp.clone().normalize();
    camTarget.copy(wp).add(dir.multiplyScalar(26)).add(new THREE.Vector3(0,10,0));
    lookTarget.copy(wp);
  }
  camera.position.lerp(camTarget, 1-Math.pow(0.001,dt));
  const curLook = new THREE.Vector3();
  camera.getWorldDirection(curLook);
  const desiredLook = lookTarget.clone().sub(camera.position).normalize();
  const newDir = curLook.lerp(desiredLook, 1-Math.pow(0.001,dt));
  camera.lookAt(camera.position.clone().add(newDir));

  if(focused){
    const wp = new THREE.Vector3();
    focused.mesh.getWorldPosition(wp);
    if(camera.position.distanceTo(wp) < 32 && !hud.classList.contains('show')){
      hud.classList.add('show');
    }
  }

  renderer.render(scene, camera);
}

/* ---------------- Ouverture ---------------- */
document.getElementById('enterBtn').addEventListener('click', ()=>{
  document.getElementById('opening').classList.add('hide');
  setTimeout(()=> hint.classList.add('show'), 500);
});

init();
</script>
</body>
</html>
