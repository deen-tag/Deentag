<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Deentag Kids — Le Masjid des Lumières, apprends le dernier Hizb du Coran en jouant">
<meta name="theme-color" content="#1A2A4A">
<title>Deentag Kids — Le Masjid des Lumières</title>
<link rel="stylesheet" href="css/kids.css">
<link rel="stylesheet" href="css/masjid.css">
<link rel="icon" href="favicon.png" type="image/png">
</head>
<body class="page-quran-kids" data-page="masjid">

<!-- ===== ÉCRAN 1 — CHOIX DU PALIER ===== -->
<div id="screenPalier" class="mj-screen" style="display:none;">
  <div class="kids-topbar">
    <div class="kids-topbar-left"></div>
    <div class="kids-topbar-center">
      <img src="images/kids_logo.webp" alt="Deentag Kids" class="kids-topbar-logo"
           onerror="this.style.display='none'">
    </div>
    <div class="kids-topbar-right"></div>
  </div>

  <div class="mj-palier-title">🕌 Le Masjid des Lumières</div>
  <div class="mj-palier-sub">Choisis ton niveau pour commencer à apprendre les sourates</div>

  <div class="mj-palier-choices">
    <button class="mj-palier-card" onclick="masjidChoosePalier('petit')">
      <span class="mj-palier-emoji">🕯️</span>
      <span>
        <div class="mj-palier-name">Petit</div>
        <div class="mj-palier-desc">4-6 ans · j'écoute et je reconnais</div>
      </span>
    </button>
    <button class="mj-palier-card" onclick="masjidChoosePalier('moyen')">
      <span class="mj-palier-emoji">🧱</span>
      <span>
        <div class="mj-palier-name">Moyen</div>
        <div class="mj-palier-desc">7-9 ans · je remets les mots en ordre</div>
      </span>
    </button>
    <button class="mj-palier-card" onclick="masjidChoosePalier('grand')">
      <span class="mj-palier-emoji">🕌</span>
      <span>
        <div class="mj-palier-name">Grand</div>
        <div class="mj-palier-desc">10-11 ans · je reconstitue le verset seul</div>
      </span>
    </button>
  </div>
</div>

<!-- ===== ÉCRAN 2 — CARTE DU MASJID ===== -->
<div id="screenMap" class="mj-screen" style="display:none;">
  <div class="kids-topbar">
    <div class="kids-topbar-left"></div>
    <div class="kids-topbar-center">
      <img src="images/kids_logo.webp" alt="Deentag Kids" class="kids-topbar-logo"
           onerror="this.style.display='none'">
    </div>
    <div class="kids-topbar-right"></div>
  </div>

  <div class="mj-map-header">
    <button class="mj-palier-badge" id="palierBadge" onclick="masjidChangePalier()"></button>
    <span></span>
  </div>

  <div class="mj-masjid-hero">
    <img src="images/mosquee.webp" alt="">
    <img src="images/mosquee.webp" alt="" class="mj-masjid-fill" id="masjidFill">
  </div>
  <div class="mj-lantern-row" id="lanternRow"></div>
  <div class="mj-masjid-pct" id="masjidPct"></div>

  <div class="mj-tabs">
    <button class="mj-tab" id="tabSourates" onclick="masjidSwitchTab('sourates')">🕌 Sourates</button>
    <button class="mj-tab" id="tabInvocations" onclick="masjidSwitchTab('invocations')">🏮 Invocations</button>
  </div>

  <div class="mj-path" id="surahPath"></div>
</div>

<!-- ===== ÉCRAN 3 — JEU (une sourate) ===== -->
<div id="screenGame" class="mj-screen" style="display:none;">
  <div class="mj-game-top">
    <button class="mj-back-btn" onclick="masjidCloseGame()">←</button>
    <span>
      <div class="mj-game-title-ar" id="gameTitleAr"></div>
      <div class="mj-game-title-fr" id="gameTitleFr"></div>
    </span>
  </div>
  <div class="mj-progress-track"><div class="mj-progress-fill" id="gameProgress"></div></div>
  <div class="mj-game-content" id="gameContent"></div>
</div>

<!-- ===== MODAL BRAVO ===== -->
<div class="kids-bravo" id="bravoModalMj" style="display:none" onclick="masjidCloseBravo()">
  <div class="kids-bravo-box" onclick="event.stopPropagation()">
    <span class="kids-bravo-emoji">🕌</span>
    <div class="kids-bravo-title" id="bravoTitleMj">Bravo !</div>
    <div class="kids-bravo-sub" id="bravoSubMj"></div>
    <button class="kids-bravo-btn" onclick="masjidCloseBravo()">Continuer 🎉</button>
  </div>
</div>
<div class="confetti-container" id="confettiContainerMj"></div>

<script src="js/kids-duas.js"></script>
<script src="js/masjid.js"></script>
</body>
</html>
